name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_WRITE_SECRET: ${{ secrets.VITE_API_WRITE_SECRET }}

      - name: Ensure D1 database and Pages project exist
        run: |
          node -e '
            const fs = require("fs");
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const apiToken = process.env.CLOUDFLARE_API_TOKEN;

            async function run() {
              // 1. Ensure D1 database exists
              const listRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`, {
                headers: { Authorization: `Bearer ${apiToken}` }
              });
              const listData = await listRes.json();
              if (!listData.success) {
                throw new Error("Failed to list D1 databases: " + JSON.stringify(listData));
              }
              let db = listData.result?.find(d => d.name === "guess-the-character-db");
              if (!db) {
                console.log("Creating D1 database guess-the-character-db...");
                const createRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiToken}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ name: "guess-the-character-db" })
                });
                const createData = await createRes.json();
                if (!createData.success) {
                  throw new Error("Failed to create D1 database: " + JSON.stringify(createData));
                }
                db = createData.result;
                console.log("Created D1 database:", db.uuid);
              } else {
                console.log("Found existing D1 database:", db.uuid);
              }

              // 2. Update wrangler.jsonc with database_id
              const wranglerPath = "wrangler.jsonc";
              let content = fs.readFileSync(wranglerPath, "utf-8");
              content = content.replace(/"database_id":\s*"[^"]*"/, `"database_id": "${db.uuid}"`);
              fs.writeFileSync(wranglerPath, content, "utf-8");
              console.log("Updated wrangler.jsonc with database_id:", db.uuid);

              // 3. Ensure Pages project exists and bind D1
              const pagesRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/gooogn`, {
                headers: { Authorization: `Bearer ${apiToken}` }
              });

              const deploymentConfigs = {
                production: {
                  d1_databases: { DB: { id: db.uuid } },
                  compatibility_date: "2026-09-17"
                },
                preview: {
                  d1_databases: { DB: { id: db.uuid } },
                  compatibility_date: "2026-09-17"
                }
              };

              if (pagesRes.status === 404) {
                console.log("Creating Pages project gooogn...");
                const createPagesRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiToken}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    name: "gooogn",
                    production_branch: "main",
                    deployment_configs: deploymentConfigs
                  })
                });
                const createPagesData = await createPagesRes.json();
                console.log("Pages project created:", createPagesData.success, createPagesData.errors || "");
              } else {
                console.log("Updating existing Pages project binding...");
                const patchPagesRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/gooogn`, {
                  method: "PATCH",
                  headers: {
                    Authorization: `Bearer ${apiToken}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    deployment_configs: deploymentConfigs
                  })
                });
                const patchPagesData = await patchPagesRes.json();
                console.log("Pages project updated:", patchPagesData.success);
              }
            }

            run().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.133.0"
          command: d1 migrations apply guess-the-character-db --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.133.0"
          command: pages deploy --project-name=gooogn
