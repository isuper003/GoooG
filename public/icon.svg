<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#04060a"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0077ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- "G" Letter Fill Gradient -->
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cyan Accent Pill Gradient -->
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f0ff" flood-opacity="0.3"/>
    </filter>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="220" fill="url(#cyanGlow)"/>

  <!-- Glass Inner Squircle Box -->
  <rect x="56" y="56" width="400" height="400" rx="88" fill="#090d14" fill-opacity="0.7" stroke="url(#borderGrad)" stroke-width="4" filter="url(#boxShadow)"/>

  <!-- Futuristic Corner Accents -->
  <line x1="88" y1="120" x2="88" y2="88" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="88" x2="120" y2="88" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  
  <line x1="424" y1="392" x2="424" y2="424" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="424" y1="424" x2="392" y2="424" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylized Geometric "G" Mark -->
  <g filter="url(#shadow)">
    <!-- Main Outer Arc of "G" -->
    <path d="M 336 180
             C 310 148 270 136 230 144
             C 172 156 136 208 136 266
             C 136 326 178 376 240 376
             C 300 376 348 334 356 276
             L 248 276
             A 12 12 0 0 1 248 252
             L 372 252
             C 378 252 384 258 382 266
             C 372 350 310 404 238 404
             C 156 404 104 338 104 264
             C 104 186 156 116 234 116
             C 284 116 332 136 362 172
             Z"
          fill="url(#gGrad)"/>

    <!-- High-tech Cyan Crossbar Target Dot / Beacon -->
    <circle cx="256" cy="264" r="8" fill="#00f0ff"/>
    <circle cx="364" cy="204" r="7" fill="url(#cyanPill)"/>
  </g>
</svg>
